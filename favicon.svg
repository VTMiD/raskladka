<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Голубой фон с закруглёнными углами -->
  <rect width="100" height="100" rx="18" ry="18" fill="#8ebceb"/>
  
  <!-- Угольник (желтый) -->
  <path d="M 25 85 L 25 40 L 70 85 Z" fill="#f4c142" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Внутренний вырез угольника -->
  <path d="M 33 72 L 33 55 L 50 72 Z" fill="#8ebceb"/>

  <!-- Молоток -->
  <g transform="rotate(45, 65, 35)">
    <!-- Ручка -->
    <rect x="61" y="35" width="8" height="40" fill="#c0392b" stroke="#1a1a1a" stroke-width="3"/>
    <!-- Головка -->
    <rect x="50" y="25" width="30" height="14" rx="3" fill="#95a5a6" stroke="#1a1a1a" stroke-width="3.5"/>
  </g>

  <!-- Гаечный ключ -->
  <g transform="rotate(-45, 45, 40)">
    <!-- Рукоятка -->
    <rect x="42" y="35" width="7" height="35" fill="#f4c142" stroke="#1a1a1a" stroke-width="3"/>
    <!-- Верхняя головка -->
    <circle cx="45.5" cy="28" r="11" fill="#f4c142" stroke="#1a1a1a" stroke-width="3"/>
    <rect x="40" y="17" width="11" height="11" fill="#8ebceb"/> <!-- Вырез -->
    <!-- Нижняя головка -->
    <circle cx="45.5" cy="72" r="11" fill="#f4c142" stroke="#1a1a1a" stroke-width="3"/>
    <rect x="40" y="70" width="11" height="11" fill="#8ebceb"/> <!-- Вырез -->
  </g>
</svg>